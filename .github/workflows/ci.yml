name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke demo (tiny cohort, no figures)
        run: python -m wellbeing_watch demo --quick --no-figures --out /tmp/wb-results
      - name: Smoke demo figures
        run: python -m wellbeing_watch demo --quick --out /tmp/wb-results --docs /tmp/wb-docs
